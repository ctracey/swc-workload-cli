[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swc-workload"
dynamic = ["version"]
description = "Path-driven tree manager for workload.json files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tracer" }]
keywords = ["swc", "workload", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
swc-workload = "swc_workload.cli:main"

[project.urls]
Homepage = "https://github.com/ctracey/swc-workload-cli"
Repository = "https://github.com/ctracey/swc-workload-cli"

[tool.hatch.version]
path = "swc_workload/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["swc_workload"]
